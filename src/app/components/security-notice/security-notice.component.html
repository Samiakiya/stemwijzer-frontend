<div class="notice" [attr.role]="variant() === 'error' ? 'alert' : 'note'" [class.notice-error]="variant() === 'error'">
  @if (variant() === 'error') {
    <svg aria-hidden="true" class="notice-icon" fill="none" viewBox="0 0 20 20">
      <path d="M10 6.5v4M10 13.5h.01M17.5 10a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />
    </svg>
  } @else {
    <svg aria-hidden="true" class="notice-icon" fill="none" viewBox="0 0 20 20">
      <path d="M10 2.5 3.75 5v4.5c0 3.9 2.7 6.94 6.25 7.5 3.55-.56 6.25-3.6 6.25-7.5V5L10 2.5Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />
      <path d="m7.75 10 1.5 1.5 3-3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" />
    </svg>
  }
  <p class="notice-message">
    <ng-content />
  </p>
</div>
