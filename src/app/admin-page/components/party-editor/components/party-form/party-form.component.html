<form class="form" (ngSubmit)="handleSubmit()" [formGroup]="form">
  <div class="field">
    <label class="field-label" for="party-name">Partijnaam</label>
    <div class="field-input" [class.field-input-error]="isFieldInvalid(form.controls.name)">
      <input formControlName="name" id="party-name" placeholder="Bijvoorbeeld: Democraten 66" type="text" />
    </div>
    @if (isFieldInvalid(form.controls.name)) {
      <p class="field-error">Partijnaam is verplicht en mag maximaal 100 tekens bevatten.</p>
    }
  </div>
  <div class="field">
    <label class="field-label" for="party-description">Omschrijving (optioneel)</label>
    <textarea class="field-textarea" formControlName="description" id="party-description" placeholder="Korte omschrijving van de partij…" rows="3"></textarea>
  </div>
  <div class="field">
    <label class="field-label" for="party-image-url">Logo-URL (optioneel)</label>
    <div class="field-input">
      <input formControlName="imageUrl" id="party-image-url" placeholder="https://example.com/logo.png" type="text" />
    </div>
  </div>
  <label class="checkbox-field">
    <input formControlName="isActive" type="checkbox" />
    <span>Partij is actief</span>
  </label>
  <div class="form-actions">
    <stw-button type="button" variant="secondary" (buttonClick)="cancelled.emit()">Annuleren</stw-button>
    <stw-button type="submit" [loading]="loading()">Partij opslaan</stw-button>
  </div>
</form>
