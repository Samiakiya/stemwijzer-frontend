<div class="quiz-page">
  <stw-quiz-header (back)="handleBack()" [backDisabled]="backDisabled()" [backLabel]="header().backLabel" [heading]="header().heading" />

  <main class="quiz-main">
    @switch (view()) {
      @case ('overview') {
        <stw-answers-overview (edit)="editStatement($event)" (restart)="restart()" (toResults)="changeView('weighting')" [answers]="answers()" [statements]="statements()" />
      }
      @case ('weighting') {
        <stw-statement-weighting
          (skipped)="skipWeighting()"
          (submitted)="submitMatching()"
          (toggled)="toggleImportant($event)"
          [errorMessage]="matchingError()"
          [important]="important()"
          [statements]="statements()"
          [submitting]="submitting()"
        />
      }
      @case ('results') {
        @if (matchingResult(); as result) {
          <stw-results
            (restart)="restart()"
            (showOverview)="changeView('overview')"
            [answerSummary]="answerSummary()"
            [matchingResult]="result"
            [partyLabels]="partyLabels()"
          />
        }
      }
      @default {
        <stw-statement-flow
          (answered)="recordAnswer($event)"
          (retry)="retry()"
          (viewChanged)="changeView($event)"
          [currentAnswer]="currentAnswer()"
          [errorMessage]="errorMessage()"
          [statement]="current()"
          [total]="total()"
          [view]="view()"
        />
      }
    }
  </main>

  <stw-quiz-bottom-nav (selected)="selectTab($event)" [active]="activeTab()" [resultsAvailable]="matchingResult() !== null" />
</div>
